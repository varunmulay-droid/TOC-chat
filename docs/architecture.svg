<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
    <linearGradient id="userGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8bbd0"/>
      <stop offset="100%" stop-color="#f48fb1"/>
    </linearGradient>
    <linearGradient id="uiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe0b2"/>
      <stop offset="100%" stop-color="#ffcc80"/>
    </linearGradient>
    <linearGradient id="storeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8e6c9"/>
      <stop offset="100%" stop-color="#a5d6a7"/>
    </linearGradient>
    <linearGradient id="llmGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d1c4e9"/>
      <stop offset="100%" stop-color="#b39ddb"/>
    </linearGradient>
    <linearGradient id="embedGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b3e5fc"/>
      <stop offset="100%" stop-color="#81d4fa"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <style>
    .box { stroke: #333; stroke-width: 1.4; rx: 10; filter: url(#softShadow); }
    .label { font-size: 15px; font-weight: 600; fill: #1a1a1a; text-anchor: middle; }
    .sub { font-size: 11px; fill: #444; text-anchor: middle; }
    .title { font-size: 22px; font-weight: 700; fill: #111; text-anchor: middle; }
    .subtitle { font-size: 12px; fill: #666; text-anchor: middle; font-style: italic; }
    .edge { stroke: #4a4a4a; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .edgelabel { font-size: 10.5px; fill: #555; text-anchor: middle; }
    .groupbg { fill: #fafafa; stroke: #ddd; stroke-width: 1; stroke-dasharray: 4 3; rx: 12; }
    .grouplabel { font-size: 11px; fill: #888; font-weight: 600; letter-spacing: 0.5px; }
  </style>

  <text x="500" y="32" class="title">TOC-chat — Simple RAG Assistant</text>
  <text x="500" y="52" class="subtitle">Two files. Open-source model. No compiled dependencies.</text>

  <!-- User -->
  <rect x="410" y="75" width="180" height="46" class="box" fill="url(#userGrad)"/>
  <text x="500" y="103" class="label">User</text>

  <!-- Gradio UI group -->
  <rect x="60" y="150" width="880" height="90" class="groupbg"/>
  <text x="90" y="168" class="grouplabel">GRADIO UI — app.py</text>

  <rect x="90" y="180" width="240" height="50" class="box" fill="url(#uiGrad)"/>
  <text x="210" y="200" class="label">Chat tab</text>
  <text x="210" y="216" class="sub">chat_fn()</text>

  <rect x="380" y="180" width="240" height="50" class="box" fill="url(#uiGrad)"/>
  <text x="500" y="200" class="label">Upload documents tab</text>
  <text x="500" y="216" class="sub">ingest_fn()</text>

  <rect x="670" y="180" width="240" height="50" class="box" fill="url(#uiGrad)"/>
  <text x="790" y="200" class="label">Generate Excel tab</text>
  <text x="790" y="216" class="sub">excel_fn()</text>

  <!-- Ingestion path -->
  <rect x="380" y="280" width="240" height="55" class="box" fill="url(#embedGrad)"/>
  <text x="500" y="302" class="label">Read + Chunk</text>
  <text x="500" y="318" class="sub">read_any_file() · chunk_text()</text>
  <text x="500" y="330" class="sub">PDF / TXT / CSV / XLSX</text>

  <!-- Retrieval path -->
  <rect x="90" y="280" width="240" height="55" class="box" fill="url(#embedGrad)"/>
  <text x="210" y="302" class="label">retrieve()</text>
  <text x="210" y="318" class="sub">MiniLM query embedding</text>
  <text x="210" y="330" class="sub">+ cosine similarity</text>

  <!-- Shared embedder -->
  <rect x="235" y="360" width="230" height="50" class="box" fill="url(#embedGrad)"/>
  <text x="350" y="380" class="label">MiniLM Encoder</text>
  <text x="350" y="396" class="sub">all-MiniLM-L6-v2 (CPU, 384-dim)</text>

  <!-- Vector store -->
  <rect x="90" y="440" width="240" height="55" class="box" fill="url(#storeGrad)"/>
  <text x="210" y="462" class="label">Vector store</text>
  <text x="210" y="478" class="sub">plain NumPy array</text>
  <text x="210" y="490" class="sub">(no FAISS dependency)</text>

  <!-- JSON conversation memory -->
  <rect x="670" y="280" width="240" height="55" class="box" fill="url(#storeGrad)"/>
  <text x="790" y="302" class="label">Conversation memory</text>
  <text x="790" y="318" class="sub">chat_memory.json</text>
  <text x="790" y="330" class="sub">last 6 turns fed back to model</text>

  <!-- LLM -->
  <rect x="350" y="530" width="300" height="65" class="box" fill="url(#llmGrad)"/>
  <text x="500" y="555" class="label">Qwen2.5-1.5B-Instruct</text>
  <text x="500" y="572" class="sub">generate() — open source, plain fp16/fp32 load</text>
  <text x="500" y="586" class="sub">no GPTQ · no bitsandbytes</text>

  <!-- Response -->
  <rect x="410" y="630" width="180" height="46" class="box" fill="url(#userGrad)"/>
  <text x="500" y="658" class="label">Response</text>

  <!-- Excel export branch -->
  <rect x="670" y="630" width="240" height="55" class="box" fill="url(#storeGrad)"/>
  <text x="790" y="652" class="label">generate_excel()</text>
  <text x="790" y="668" class="sub">CSV parsed → pandas → .xlsx download</text>

  <!-- Edges -->
  <path class="edge" d="M500,121 L500,150"/>

  <path class="edge" d="M210,230 L210,280"/>
  <path class="edge" d="M500,230 L500,280"/>
  <path class="edge" d="M790,230 L790,280"/>

  <path class="edge" d="M300,307 C320,320 330,330 340,355"/>
  <path class="edge" d="M350,410 C280,420 240,430 220,440"/>

  <path class="edge" d="M210,335 L210,360"/>
  <text x="150" y="350" class="edgelabel">embed query</text>

  <path class="edge" d="M210,495 C210,520 300,545 350,555"/>
  <text x="245" y="530" class="edgelabel">top-k chunks</text>

  <path class="edge" d="M790,335 C790,400 650,480 620,545"/>
  <text x="770" y="420" class="edgelabel">recent turns</text>

  <path class="edge" d="M500,595 L500,630"/>
  <path class="edge" d="M620,650 C660,650 660,650 670,650"/>
  <path class="edge" d="M590,653 L670,652"/>

  <path class="edge" d="M500,676 C500,700 700,700 790,685"/>
  <text x="640" y="700" class="edgelabel">save_turn() → chat_memory.json</text>

</svg>
