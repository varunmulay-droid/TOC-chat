<svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <style>
    .box { stroke: #333; stroke-width: 1.5; rx: 8; }
    .user { fill: #fce4ec; }
    .toc { fill: #e3f2fd; }
    .route { fill: #fff3e0; }
    .branch { fill: #e8f5e9; }
    .llm { fill: #ede7f6; }
    .out { fill: #fce4ec; }
    .label { font-size: 15px; fill: #222; text-anchor: middle; }
    .sub { font-size: 11px; fill: #555; text-anchor: middle; }
    .title { font-size: 20px; font-weight: bold; fill: #111; text-anchor: middle; }
    .edge { stroke: #444; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>

  <text x="500" y="30" class="title">TOC-GPT Architecture</text>

  <!-- User input -->
  <rect x="400" y="55" width="200" height="45" class="box user"/>
  <text x="500" y="83" class="label">User Input</text>

  <!-- DFA state check -->
  <rect x="375" y="130" width="250" height="50" class="box toc"/>
  <text x="500" y="152" class="label">DFA State Check</text>
  <text x="500" y="168" class="sub">toc/dfa.py — conversation state manager</text>

  <!-- NFA scan -->
  <rect x="375" y="210" width="250" height="50" class="box toc"/>
  <text x="500" y="232" class="label">NFA Fast Intent Scan</text>
  <text x="500" y="248" class="sub">toc/nfa.py — cheap pattern pre-scan</text>

  <!-- CFG branch (left) -->
  <rect x="90" y="300" width="230" height="50" class="box toc"/>
  <text x="205" y="322" class="label">CFG Command Parse</text>
  <text x="205" y="338" class="sub">toc/cfg.py — explicit /commands only</text>

  <!-- Semantic route (right) -->
  <rect x="680" y="300" width="230" height="50" class="box route"/>
  <text x="795" y="322" class="label">MiniLM Semantic Route</text>
  <text x="795" y="338" class="sub">models/encoder.py</text>

  <!-- Tool path -->
  <rect x="60" y="390" width="290" height="60" class="box branch"/>
  <text x="205" y="413" class="label">Tool Path</text>
  <text x="205" y="429" class="sub">PDA bracket validation, then</text>
  <text x="205" y="443" class="sub">calculator / python / memory-write / search</text>

  <!-- Chat / RAG / Memory branches -->
  <rect x="580" y="390" width="130" height="55" class="box branch"/>
  <text x="645" y="415" class="label">Chat</text>
  <text x="645" y="431" class="sub">plain LLM</text>

  <rect x="725" y="390" width="130" height="55" class="box branch"/>
  <text x="790" y="415" class="label">RAG</text>
  <text x="790" y="431" class="sub">FAISS docs</text>

  <rect x="870" y="390" width="110" height="55" class="box branch"/>
  <text x="925" y="415" class="label">Memory</text>
  <text x="925" y="431" class="sub">FAISS convo</text>

  <!-- Context builder -->
  <rect x="375" y="480" width="250" height="50" class="box route"/>
  <text x="500" y="502" class="label">Context Builder</text>
  <text x="500" y="518" class="sub">assembles retrieved chunks + history</text>

  <!-- LLM -->
  <rect x="350" y="560" width="300" height="60" class="box llm"/>
  <text x="500" y="585" class="label">Qwen2.5 (3B default, 4-bit)</text>
  <text x="500" y="601" class="sub">models/llm.py — lazy-loaded, size configurable</text>

  <!-- Response -->
  <rect x="400" y="650" width="200" height="45" class="box out"/>
  <text x="500" y="678" class="label">Response</text>

  <!-- Embed + memory write -->
  <rect x="375" y="725" width="250" height="50" class="box toc"/>
  <text x="500" y="747" class="label">Embed + FAISS Memory Write</text>
  <text x="500" y="763" class="sub">memory/memory_manager.py</text>

  <!-- Gradio UI -->
  <rect x="400" y="805" width="200" height="45" class="box user"/>
  <text x="500" y="833" class="label">Gradio UI</text>

  <!-- Edges -->
  <path class="edge" d="M500,100 L500,130"/>
  <path class="edge" d="M500,180 L500,210"/>

  <path class="edge" d="M420,260 C350,275 260,285 205,300"/>
  <text x="290" y="280" class="sub">slash-command flagged</text>

  <path class="edge" d="M580,260 C650,275 740,285 795,300"/>
  <text x="700" y="280" class="sub">no command match</text>

  <path class="edge" d="M205,350 L205,390"/>

  <path class="edge" d="M760,350 C700,365 670,375 645,390"/>
  <path class="edge" d="M795,350 L790,390"/>
  <path class="edge" d="M830,350 C860,365 900,375 925,390"/>

  <path class="edge" d="M350,420 C420,450 440,460 460,480"/>
  <path class="edge" d="M645,445 C600,460 560,470 540,480"/>
  <path class="edge" d="M790,445 C700,465 580,475 550,480"/>
  <path class="edge" d="M925,445 C800,470 600,478 560,485"/>

  <path class="edge" d="M500,530 L500,560"/>
  <path class="edge" d="M500,620 L500,650"/>
  <path class="edge" d="M500,695 L500,725"/>
  <path class="edge" d="M500,775 L500,805"/>

  <!-- Tool path skips context builder, goes straight to response -->
  <path class="edge" d="M230,450 C280,520 350,600 400,660"/>
  <text x="330" y="560" class="sub">tool result</text>
</svg>
